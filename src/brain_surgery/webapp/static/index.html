<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>brain-surgery · memory review</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%234c8dff'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='white'%3E%E2%8C%81%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo">⌁</span> brain-surgery<span class="sub">memory review</span>
      <span id="ro-badge" class="badge hidden">read-only</span>
    </div>
    <div id="stats" class="stats"></div>
    <div class="actions">
      <button id="btn-roots" class="ghost" title="Group flagged blocks by the source they trace to">Roots</button>
      <button id="btn-scoped" class="ghost" title="Model-scoped memory and suggestions">Scoped</button>
      <button id="btn-rescan" class="ghost">Rescan</button>
      <button id="btn-theme" class="ghost" title="Toggle theme">◐</button>
    </div>
  </header>

  <section id="band" class="band"></section>

  <main>
    <div class="col map-col">
      <div class="col-head"><span id="crumbs" class="crumbs"></span></div>
      <div id="treemap" class="treemap"></div>
      <div class="legend">
        <span><i class="sw r0"></i>ok</span><span><i class="sw r1"></i>unsure</span>
        <span><i class="sw r2"></i>review</span><span><i class="sw r3"></i>flagged</span>
        <span class="muted">size = bytes</span>
      </div>
    </div>
    <div class="col detail-col">
      <div id="detail" class="detail"><p class="muted pad">Pick a file in the map, or a group above, to review its memory blocks.</p></div>
    </div>
  </main>

  <div id="tray" class="tray hidden">
    <div class="tray-head">
      <strong><span id="tray-count">0</span> selected</strong>
      <button id="tray-clear" class="ghost small">clear</button>
    </div>
    <div id="tray-list" class="tray-list"></div>
    <div class="tray-foot">
      <input id="tray-reason" type="text" placeholder="reason (required for quarantine)">
      <label class="chk"><input type="checkbox" id="tray-force"> force managed</label>
      <select id="tray-scope" class="hidden tsel" title="scope the selection to a model"></select>
      <button id="tray-scope-go" class="ghost hidden">Scope</button>
      <button id="tray-go" class="primary">Quarantine</button>
    </div>
  </div>

  <button id="holds-toggle" class="holds-toggle">Holds <span id="holds-badge" class="pill">0</span></button>
  <aside id="holds" class="holds hidden"></aside>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
